# Standard GitHub Pages deployment for a Vite app deployed to the main
# site (username.github.io) under /<repo>/.
#
# This works because:
#   - vite.config.js sets base: "/pokedex-mini/" to match the repo sub-path
#   - App.jsx uses HashRouter, so client-side routes never 404 on refresh
#
# After pushing this, go to:
#   Repo -> Settings -> Pages -> Source -> choose "GitHub Actions"
# (once, manually). Every push to main will then auto-redeploy.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions required for Pages + OIDC deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time per repo
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
